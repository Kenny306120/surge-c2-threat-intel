name: Update IOC rules

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build IOC rules
        env:
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
        run: python build_ioc.py

      - name: Commit updated rules
        run: |
          git config user.name "ioc-updater"
          git config user.email "ioc-updater@users.noreply.github.com"
          git add rules/
          git diff --cached --quiet || (git commit -m "Update IOC rules" && git push)
